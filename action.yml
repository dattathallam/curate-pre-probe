name: curate-pre-probe
description: Probe - reads the runner's _diag in `pre` (before any other action's pre) and hands the snapshot to `main`, which only decides.
author: dattathallam
inputs:
  failinpre:
    description: probe only - exit non-zero from pre after saving the snapshot
    default: 'false'
  padkb:
    description: probe only - extra KB of filler saved in step state, to find the size limit
    default: '0'
  cancelinpre:
    description: probe only - cancel the whole run through the REST API from pre, then wait
    default: 'false'
  token:
    description: probe only - token for the cancel call
    default: ''
runs:
  using: node20
  pre: pre.js
  main: main.js
  post: post.js
